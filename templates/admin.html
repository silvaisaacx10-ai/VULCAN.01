<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VULCAN Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f0f13; color: #fff; }
        .admin-login-wrapper {
            display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }
        .admin-login-card {
            background: #1a1a24; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); text-align: center;
        }
        .admin-login-card input {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333;
            background: #0f0f13; color: #fff;
        }
        .admin-login-card button {
            width: 100%; padding: 12px; background: #d2ff00; color: #000; border: none; border-radius: 8px;
            font-weight: 600; cursor: pointer;
        }
        .badge {
            padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600;
        }
        .badge.active { background: rgba(40, 167, 69, 0.2); color: #28a745; }
        .badge.inactive { background: rgba(220, 53, 69, 0.2); color: #dc3545; }
    </style>
</head>
<body>
    <div id="admin-login" class="admin-login-wrapper">
        <div class="admin-login-card">
            <h2>VULCAN ADMIN</h2><br><br>
            <input type="email" id="admin-email" placeholder="Email Admin">
            <input type="password" id="admin-password" placeholder="Senha Admin">
            <button onclick="loginAdmin()">Entrar no Painel</button>
        </div>
    </div>

    <div id="app-container" style="display:none; flex-direction:column; min-height:100vh;">
        <header style="padding: 20px; border-bottom: 1px solid #242431; display:flex; justify-content:space-between; align-items:center;">
            <h2>Painel Administrativo</h2>
            <span id="admin-name-display" style="font-weight:bold; color:#d2ff00;"></span>
        </header>

        <div style="padding: 2rem; display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
            <div style="background:#1a1a24; padding:20px; border-radius:12px;">
                <h4 style="color:#9ea0ab;">Total de Alunos</h4>
                <div id="kpi-total-users" style="font-size:2rem; font-weight:bold;">0</div>
            </div>
            <div style="background:#1a1a24; padding:20px; border-radius:12px;">
                <h4 style="color:#9ea0ab;">Bloqueados</h4>
                <div id="kpi-blocked" style="font-size:2rem; font-weight:bold; color:#dc3545;">0</div>
            </div>
            <div style="background:#1a1a24; padding:20px; border-radius:12px;">
                <h4 style="color:#9ea0ab;">Tempo Médio (App)</h4>
                <div id="kpi-avg-time" style="font-size:2rem; font-weight:bold;">24 min/dia</div>
            </div>
        </div>

        <div style="padding: 0 2rem; display:flex; gap:20px; flex-wrap:wrap;">
            <div style="flex: 1; background:#1a1a24; padding:20px; border-radius:12px; min-width:300px;">
                <h3 style="margin-bottom:15px;">Engajamento</h3>
                <canvas id="admin-chart"></canvas>
            </div>
            
            <div style="flex: 2; background:#1a1a24; padding:20px; border-radius:12px; min-width:400px; overflow-x:auto;">
                <h3 style="margin-bottom:15px;">Gerenciamento de Alunos</h3>
                <table style="width:100%; border-collapse:collapse; text-align:left;">
                    <thead>
                        <tr style="border-bottom: 1px solid #333;">
                            <th style="padding:10px;">Nome / Email</th>
                            <th style="padding:10px;">Acesso e Cadastro</th>
                            <th style="padding:10px;">Status</th>
                            <th style="padding:10px;">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="admin-users-table"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let adminEmail = '';
        let adminPass = '';
        let usersData = [];
        let chartInst = null;

        async function loginAdmin() {
            adminEmail = document.getElementById('admin-email').value;
            adminPass = document.getElementById('admin-password').value;
            try {
                const res = await fetch('/api/admin/users', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: adminEmail, password: adminPass})
                });
                const data = await res.json();
                if(res.ok) {
                    document.getElementById('admin-login').style.display = 'none';
                    document.getElementById('app-container').style.display = 'flex';
                    document.getElementById('admin-name-display').textContent = adminEmail.includes('isaac') ? 'Isaac' : 'João';
                    usersData = data.users;
                    renderAdmin();
                } else {
                    alert(data.error || 'Acesso negado');
                }
            } catch(e) { alert('Erro de conexão'); }
        }

        function formatDateTime(isoString) {
            if (!isoString) return '<span style="color:#ff4757;">Ainda não acessou</span>';
            const d = new Date(isoString);
            return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR');
        }

        function renderAdmin() {
            const total = usersData.length;
            const blocked = usersData.filter(u => u.is_blocked).length;
            document.getElementById('kpi-total-users').textContent = total;
            document.getElementById('kpi-blocked').textContent = blocked;

            const tbody = document.getElementById('admin-users-table');
            tbody.innerHTML = '';
            
            usersData.forEach(u => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid #333';
                const statusHtml = u.is_blocked 
                    ? `<span class="badge inactive">Bloqueado (${u.blocked_by || 'Auto'})</span>`
                    : `<span class="badge active">Ativo</span>`;
                const btnHtml = u.is_blocked
                    ? `<button style="padding:5px 10px; background:#28a745; color:#fff; border:none; border-radius:4px; cursor:pointer;" onclick="toggleBlock('${u.email}')">Desbloquear</button>`
                    : `<button style="padding:5px 10px; background:#dc3545; color:#fff; border:none; border-radius:4px; cursor:pointer;" onclick="toggleBlock('${u.email}')">Bloquear</button>`;

                tr.innerHTML = `
                    <td style="padding:10px;">
                        <strong>${u.name}</strong><br>
                        <small style="color:#9ea0ab;">${u.email}</small>
                    </td>
                    <td style="padding:10px;">
                        <small style="color:#9ea0ab;">Criado em: ${new Date(u.created_at).toLocaleDateString('pt-BR')}</small><br>
                        <strong>Último acesso:</strong> ${formatDateTime(u.last_active)}
                    </td>
                    <td style="padding:10px;">${statusHtml}</td>
                    <td style="padding:10px;">${btnHtml}</td>
                `;
                tbody.appendChild(tr);
            });
            renderChart();
        }

        async function toggleBlock(targetEmail) {
            try {
                const res = await fetch('/api/admin/toggle-block', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({admin_email: adminEmail, admin_password: adminPass, target_email: targetEmail})
                });
                if(res.ok) {
                    const u = usersData.find(x => x.email === targetEmail);
                    u.is_blocked = !u.is_blocked;
                    u.blocked_by = u.is_blocked ? 'Admin' : null;
                    renderAdmin();
                } else {
                    const data = await res.json();
                    alert('Erro: ' + data.error);
                }
            } catch(e) { alert('Erro de conexão'); }
        }

        function renderChart() {
            const ctx = document.getElementById('admin-chart').getContext('2d');
            if(chartInst) chartInst.destroy();
            const active = usersData.length - usersData.filter(u => u.is_blocked).length;
            const blocked = usersData.filter(u => u.is_blocked).length;
            chartInst = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Ativos', 'Bloqueados'],
                    datasets: [{ data: [active, blocked], backgroundColor: ['#d2ff00', '#dc3545'], borderWidth: 0 }]
                },
                options: { responsive: true, plugins: { legend: { labels: { color: '#fff' } } } }
            });
        }
    </script>
</body>
</html>
